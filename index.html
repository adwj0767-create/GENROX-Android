
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENROX</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px;background:#080808;color:white;
 font-family:Arial;text-align:center
}
h1{font-size:38px;color:#d6ad55;letter-spacing:3px}
.panel{
 max-width:600px;margin:18px auto;padding:18px;
 background:#171717;border:1px solid #8c6b30;
 border-radius:15px
}
h3{color:#e4c477}
label{display:block;text-align:right;margin-top:15px;color:#e4c477}
input[type=file],input[type=text],select{
 width:100%;padding:12px;margin-top:8px;
 background:#252525;color:white;border:1px solid #777;border-radius:8px
}
input[type=range]{width:100%;accent-color:#d6ad55}
button{
 width:100%;padding:14px;margin-top:12px;border:0;
 border-radius:9px;background:#c49a43;color:#111;
 font-size:16px;font-weight:bold
}
button:disabled{opacity:.45}
video{width:100%;max-height:320px;background:#000;border-radius:10px}
.video-wrap{position:relative;margin-top:12px}
#overlayPreview{
 position:absolute;left:15px;right:15px;
 color:white;font-weight:bold;font-size:36px;
 text-align:center;pointer-events:none;
 text-shadow:2px 2px 5px black;
 overflow-wrap:anywhere
}
#status,#mergeStatus{color:#e4c477;margin-top:15px}
a{display:none;color:#e4c477;margin-top:15px}
.note{font-size:13px;color:#aaa;line-height:1.7}
</style>
</head>
<body>

<h1>GENROX</h1>
<p>استوديو تحرير الفيديو</p>

<div class="panel">
<h3>اختيار الفيديو ومعاينته</h3>
<input id="file" type="file" accept="video/*">
<div class="video-wrap">
<video id="video" controls playsinline></video>
<div id="overlayPreview"></div>
</div>
<div id="status">اختر فيديو للبدء</div>
</div>

<div class="panel">
<h3>الكتابة على الفيديو</h3>
<label>اكتب النص</label>
<input id="overlayText" type="text" placeholder="اكتب هنا...">

<label>لون الكتابة</label>
<input id="overlayColor" type="color" value="#ffffff">

<label>حجم الخط</label>
<input id="overlaySize" type="range" min="16" max="80" value="36">

<label>مكان الكتابة</label>
<select id="overlayPosition">
<option value="top">أعلى الفيديو</option>
<option value="center" selected>منتصف الفيديو</option>
<option value="bottom">أسفل الفيديو</option>
</select>
</div>

<div class="panel">
<h3>قص الفيديو</h3>

<label>بداية المقطع</label>
<input id="start" type="range" min="0" max="0" value="0" step="0.1">
<div id="startTime">0 ثانية</div>

<label>نهاية المقطع</label>
<input id="end" type="range" min="0" max="0" value="0" step="0.1">
<div id="endTime">0 ثانية</div>

<button id="preview" disabled>معاينة الجزء المحدد</button>
<button id="stop" disabled>إيقاف المعاينة</button>
<button id="export" disabled>تصدير الفيديو بالكتابة</button>
<a id="download" download="GENROX-clip.webm">تحميل الفيديو</a>
</div>

<div class="panel">
<h3>دمج مقطعين فيديو</h3>
<p class="note">اختر الفيديو الأول ثم الثاني</p>

<label>الفيديو الأول</label>
<input id="mergeFile1" type="file" accept="video/*">

<label>الفيديو الثاني</label>
<input id="mergeFile2" type="file" accept="video/*">

<button id="swapBtn">تبديل ترتيب الفيديوهين</button>
<button id="mergeBtn">دمج وتصدير الفيديوهين</button>
<a id="mergeDownload" download="GENROX-merged.webm">تحميل الفيديو المدمج</a>
<div id="mergeStatus">اختر مقطعين للبدء</div>
</div>

<script>
const $=id=>document.getElementById(id);
const video=$("video");
let videoURL=null;
let previewCheck=null;
let reverseMergeOrder=false;

function updateOverlayPreview(){
 const el=$("overlayPreview");
 const text=$("overlayText").value;
 const size=Number($("overlaySize").value);
 const pos=$("overlayPosition").value;

 el.textContent=text;
 el.style.color=$("overlayColor").value;
 el.style.fontSize=size+"px";

 if(pos==="top"){
  el.style.top="15px";
  el.style.bottom="auto";
  el.style.transform="none";
 }else if(pos==="bottom"){
  el.style.bottom="15px";
  el.style.top="auto";
  el.style.transform="none";
 }else{
  el.style.top="50%";
  el.style.bottom="auto";
  el.style.transform="translateY(-50%)";
 }
}

["overlayText","overlayColor","overlaySize","overlayPosition"]
.forEach(id=>$(id).addEventListener("input",updateOverlayPreview));

updateOverlayPreview();

function drawOverlayText(ctx,canvas){
 const text=$("overlayText").value;
 if(!text.trim())return;

 const size=Number($("overlaySize").value);
 const pos=$("overlayPosition").value;

 ctx.save();
 ctx.font="bold "+size+"px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.direction="rtl";
 ctx.fillStyle=$("overlayColor").value;
 ctx.shadowColor="#000";
 ctx.shadowBlur=5;

 let y=canvas.height/2;
 if(pos==="top")y=size+20;
 if(pos==="bottom")y=canvas.height-size-20;

 ctx.fillText(text,canvas.width/2,y,canvas.width-30);
 ctx.restore();
}

function getMime(){
 const types=[
  "video/webm;codecs=vp8,opus",
  "video/webm;codecs=vp8",
  "video/webm"
 ];
 return types.find(t=>MediaRecorder.isTypeSupported(t));
}

function showDownload(link,blob){
 if(link.dataset.url)URL.revokeObjectURL(link.dataset.url);
 const url=URL.createObjectURL(blob);
 link.dataset.url=url;
 link.href=url;
 link.style.display="block";
}

$("file").addEventListener("change",()=>{
 const f=$("file").files[0];
 if(!f)return;

 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(f);
 video.src=videoURL;
 $("download").style.display="none";
 $("status").textContent="جاري تحميل الفيديو";
});

video.addEventListener("loadedmetadata",()=>{
 $("start").max=video.duration;
 $("end").max=video.duration;
 $("start").value=0;
 $("end").value=video.duration;
 updateTimes();
 $("preview").disabled=false;
 $("export").disabled=false;
 $("status").textContent="الفيديو جاهز";
});

function updateTimes(){
 $("startTime").textContent=Number($("start").value).toFixed(1)+" ثانية";
 $("endTime").textContent=Number($("end").value).toFixed(1)+" ثانية";
}

$("start").addEventListener("input",()=>{
 if(+$("start").value>=+$("end").value)
  $("start").value=Math.max(0,+$("end").value-.1);
 updateTimes();
});

$("end").addEventListener("input",()=>{
 if(+$("end").value<=+$("start").value)
  $("end").value=Math.min(video.duration,+$("start").value+.1);
 updateTimes();
});

$("preview").onclick=async()=>{
 if(!video.src)return;
 video.pause();
 video.currentTime=+$("start").value;
 await new Promise(resolve=>video.addEventListener("seeked",resolve,{once:true}));
 await video.play();

 $("preview").disabled=true;
 $("stop").disabled=false;
 $("status").textContent="جاري المعاينة";

 const check=()=>{
  if(video.currentTime>=+$("end").value){
   video.pause();
   $("preview").disabled=false;
   $("stop").disabled=true;
   $("status").textContent="انتهت المعاينة";
  }else{
   previewCheck=requestAnimationFrame(check);
  }
 };
 check();
};

$("stop").onclick=()=>{
 if(previewCheck)cancelAnimationFrame(previewCheck);
 video.pause();
 $("preview").disabled=false;
 $("stop").disabled=true;
 $("status").textContent="تم إيقاف المعاينة";
};

$("export").onclick=async()=>{
 if(!video.videoWidth||!window.MediaRecorder){
  $("status").textContent="التصدير غير مدعوم في المتصفح";
  return;
 }

 const mime=getMime();
 if(!mime)return;

 const canvas=document.createElement("canvas");
 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;
 const ctx=canvas.getContext("2d");
 const stream=canvas.captureStream(30);
 let sourceStream=null;

 try{
  const capture=video.captureStream||video.mozCaptureStream;
  if(capture){
   sourceStream=capture.call(video);
   sourceStream.getAudioTracks().forEach(t=>stream.addTrack(t));
  }
 }catch(e){}

 const chunks=[];
 const recorder=new MediaRecorder(stream,{mimeType:mime});
 const from=+$("start").value;
 const to=+$("end").value;

 if(to<=from){
  $("status").textContent="حدد بداية ونهاية صحيحتين";
  return;
 }

 recorder.ondataavailable=e=>{
  if(e.data.size)chunks.push(e.data);
 };

 const finished=new Promise(resolve=>{
  recorder.onstop=()=>{
   const blob=new Blob(chunks,{type:mime});
   showDownload($("download"),blob);
   $("status").textContent="تم إنشاء الفيديو";
   resolve();
  };
 });

 $("export").disabled=true;
 $("status").textContent="جاري التصدير";
 video.pause();
 video.currentTime=from;

 await new Promise(resolve=>video.addEventListener("seeked",resolve,{once:true}));

 try{
  recorder.start();
  await video.play();

  const draw=()=>{
   if(video.readyState>=2){
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    drawOverlayText(ctx,canvas);
   }

   if(video.currentTime<to&&!video.paused){
    requestAnimationFrame(draw);
   }else if(recorder.state!=="inactive"){
    video.pause();
    recorder.stop();
   }
  };
  draw();
  await finished;
 }catch(e){
  if(recorder.state!=="inactive")recorder.stop();
  $("status").textContent="تعذر التصدير";
 }

 stream.getTracks().forEach(t=>t.stop());
 if(sourceStream)sourceStream.getTracks().forEach(t=>t.stop());
 $("export").disabled=false;
};

$("swapBtn").onclick=()=>{
 reverseMergeOrder=!reverseMergeOrder;
 $("mergeStatus").textContent=reverseMergeOrder
 ?"الترتيب الحالي: الفيديو الثاني ثم الأول"
 :"الترتيب الحالي: الفيديو الأول ثم الثاني";
};

$("mergeBtn").onclick=async()=>{
 const f1=$("mergeFile1").files[0];
 const f2=$("mergeFile2").files[0];

 if(!f1||!f2){
  $("mergeStatus").textContent="اختر الفيديو الأول والثاني";
  return;
 }

 if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){
  $("mergeStatus").textContent="المتصفح لا يدعم الدمج";
  return;
 }

 const mime=getMime();
 if(!mime)return;

 const files=reverseMergeOrder?[f2,f1]:[f1,f2];
 const urls=files.map(f=>URL.createObjectURL(f));
 const players=files.map(()=>{
  const v=document.createElement("video");
  v.playsInline=true;
  v.preload="auto";
  v.muted=false;
  return v;
 });

 $("mergeBtn").disabled=true;
 $("mergeDownload").style.display="none";
 $("mergeStatus").textContent="جاري تجهيز الفيديوهات";

 let audioCtx=null;
 let stream=null;

 try{
  for(let i=0;i<2;i++){
   players[i].src=urls[i];
   await new Promise((resolve,reject)=>{
    players[i].onloadedmetadata=resolve;
    players[i].onerror=reject;
    players[i].load();
   });
  }

  const canvas=document.createElement("canvas");
  canvas.width=players[0].videoWidth||640;
  canvas.height=players[0].videoHeight||360;
  const ctx=canvas.getContext("2d");

  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  await audioCtx.resume();
  const audioDest=audioCtx.createMediaStreamDestination();

  players.forEach(v=>{
   const source=audioCtx.createMediaElementSource(v);
   source.connect(audioDest);
  });

  stream=canvas.captureStream(30);
  audioDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));

  const chunks=[];
  const recorder=new MediaRecorder(stream,{mimeType:mime});

  recorder.ondataavailable=e=>{
   if(e.data.size)chunks.push(e.data);
  };

  const finished=new Promise(resolve=>{
   recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:mime});
    showDownload($("mergeDownload"),blob);
    $("mergeStatus").textContent="تم دمج الفيديوهين بنجاح";
    resolve();
   };
  });

  recorder.start();

  for(const v of players){
   v.currentTime=0;
   await v.play();

   await new Promise(resolve=>{
    function draw(){
     if(v.readyState>=2){
      ctx.drawImage(v,0,0,canvas.width,canvas.height);
      drawOverlayText(ctx,canvas);
     }

     if(v.ended){
      resolve();
     }else{
      requestAnimationFrame(draw);
     }
    }
    draw();
   });

   v.pause();
  }

  recorder.stop();
  await finished;

 }catch(err){
  $("mergeStatus").textContent="تعذر الدمج. جرّب فيديوهات بصيغة مدعومة.";
  if(typeof recorder!=="undefined"&&recorder.state!=="inactive"){
   recorder.stop();
  }
 }finally{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(audioCtx&&audioCtx.state!=="closed")await audioCtx.close();
  players.forEach(v=>{
   v.pause();
   v.removeAttribute("src");
   v.load();
  });
  urls.forEach(URL.revokeObjectURL);
  $("mergeBtn").disabled=false;
 }
};
</script>
</body>
</html>
