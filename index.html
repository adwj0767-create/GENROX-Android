<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENROX</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:#fff;
 font-family:Arial,sans-serif;text-align:center;padding:20px
}
h1{color:#d6ad55;font-size:36px;letter-spacing:3px}
p{color:#bbb}
.panel{
 max-width:600px;margin:20px auto;padding:18px;
 background:#171717;border:1px solid #8c6b30;
 border-radius:15px
}
input[type=file]{width:100%;margin:15px 0}
video{width:100%;max-height:350px;background:#000;border-radius:10px}
label{display:block;text-align:right;margin-top:18px;color:#e4c477}
input[type=range]{width:100%;accent-color:#d6ad55}
.time{color:#d6ad55;margin:7px}
button{
 width:100%;padding:14px;margin-top:12px;
 border:0;border-radius:9px;background:#c49a43;
 color:#111;font-size:17px;font-weight:bold
}
button:disabled{opacity:.45}
#status{margin-top:15px;color:#e4c477}
#download{display:none;color:#e4c477;margin-top:15px}
</style>
</head>
<body>

<h1>GENROX</h1>
<p>استوديو تحرير الفيديو</p>

<div class="panel">
 <input id="file" type="file" accept="video/*">

 <video id="video" controls playsinline></video>

 <label>بداية المقطع</label>
 <input id="start" type="range" min="0" max="0" value="0" step="0.1">
 <div class="time" id="startTime">0.0 ثانية</div>

 <label>نهاية المقطع</label>
 <input id="end" type="range" min="0" max="0" value="0" step="0.1">
 <div class="time" id="endTime">0.0 ثانية</div>

 <button id="preview" disabled>معاينة الجزء المحدد</button>
 <button id="stop" disabled>إيقاف المعاينة</button>
 <button id="export" disabled>تصدير الفيديو المقصوص</button>

 <div id="status">اختر فيديو للبدء</div>
 <a id="download" download="GENROX-clip.webm">تحميل الفيديو المقصوص</a>
</div>

<script>
const file = document.getElementById("file");
const video = document.getElementById("video");
const start = document.getElementById("start");
const end = document.getElementById("end");
const preview = document.getElementById("preview");
const stop = document.getElementById("stop");
const exportBtn = document.getElementById("export");
const status = document.getElementById("status");
const download = document.getElementById("download");

let videoURL = null;
let recording = false;
let recorder = null;
let animation = null;
let chunks = [];

function updateTimes(){
 document.getElementById("startTime").textContent =
 Number(start.value).toFixed(1)+" ثانية";
 document.getElementById("endTime").textContent =
 Number(end.value).toFixed(1)+" ثانية";
}

file.addEventListener("change",()=>{
 const selected = file.files[0];
 if(!selected)return;

 if(videoURL) URL.revokeObjectURL(videoURL);
 videoURL = URL.createObjectURL(selected);
 video.src = videoURL;
 download.style.display="none";
 status.textContent="جاري تحميل الفيديو...";
});

video.addEventListener("loadedmetadata",()=>{
 const duration=video.duration;
 start.max=duration;
 end.max=duration;
 start.value=0;
 end.value=duration;
 updateTimes();
 preview.disabled=false;
 exportBtn.disabled=false;
 status.textContent="الفيديو جاهز للقص";
});

start.addEventListener("input",()=>{
 if(Number(start.value)>=Number(end.value)){
  start.value=Math.max(0,Number(end.value)-0.1);
 }
 updateTimes();
});

end.addEventListener("input",()=>{
 if(Number(end.value)<=Number(start.value)){
  end.value=Math.min(video.duration,Number(start.value)+0.1);
 }
 updateTimes();
});

function stopPreview(){
 video.pause();
 stop.disabled=true;
 preview.disabled=false;
}

preview.addEventListener("click",async()=>{
 if(!video.src)return;
 video.currentTime=Number(start.value);
 await video.play();
 preview.disabled=true;
 stop.disabled=false;
 status.textContent="جاري معاينة الجزء المحدد...";
 const finish=()=>{
  if(video.currentTime>=Number(end.value)){
   stopPreview();
   status.textContent="انتهت المعاينة";
  }else{
   requestAnimationFrame(finish);
  }
 };
 requestAnimationFrame(finish);
});

stop.addEventListener("click",()=>{
 stopPreview();
 status.textContent="تم إيقاف المعاينة";
});

exportBtn.addEventListener("click",async()=>{
 if(recording)return;

 if(!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream){
  status.textContent="متصفحك لا يدعم تصدير الفيديو بهذه الطريقة.";
  return;
 }

 const canvas=document.createElement("canvas");
 const ctx=canvas.getContext("2d");
 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;

 const canvasStream=canvas.captureStream(30);
 let tracks=[...canvasStream.getVideoTracks()];

 let sourceStream=null;
 try{
  const capture=video.captureStream || video.mozCaptureStream;
  if(capture){
   sourceStream=capture.call(video);
   tracks.push(...sourceStream.getAudioTracks());
  }
 }catch(e){}

 const stream=new MediaStream(tracks);
 let mime="video/webm;codecs=vp8,opus";
 if(!MediaRecorder.isTypeSupported(mime)){
  mime="video/webm";
 }
 if(!MediaRecorder.isTypeSupported(mime)){
  status.textContent="التصدير غير مدعوم في هذا المتصفح.";
  return;
 }

 chunks=[];
 try{
  recorder=new MediaRecorder(stream,{mimeType:mime});
 }catch(e){
  status.textContent="تعذر بدء التصدير.";
  return;
 }

 const from=Number(start.value);
 const to=Number(end.value);

 recorder.ondataavailable=e=>{
  if(e.data && e.data.size>0)chunks.push(e.data);
 };

 recorder.onstop=()=>{
  recording=false;
  cancelAnimationFrame(animation);
  const blob=new Blob(chunks,{type:"video/webm"});
  const url=URL.createObjectURL(blob);
  download.href=url;
  download.style.display="inline-block";
  status.textContent="تم إنشاء الفيديو. اضغط على رابط التحميل.";
  exportBtn.disabled=false;
  stop.disabled=true;
  preview.disabled=false;
  stream.getTracks().forEach(t=>t.stop());
  if(sourceStream)sourceStream.getTracks().forEach(t=>t.stop());
 };

 video.pause();
 video.currentTime=from;

 await new Promise(resolve=>{
  video.addEventListener("seeked",resolve,{once:true});
 });

 function draw(){
  if(video.readyState>=2){
   ctx.drawImage(video,0,0,canvas.width,canvas.height);
  }
  if(recording && video.currentTime<to){
   animation=requestAnimationFrame(draw);
  }
 }

 recorder.start();
 recording=true;
 exportBtn.disabled=true;
 preview.disabled=true;
 stop.disabled=true;
 status.textContent="جاري تصدير الفيديو... انتظر حتى ينتهي";

 draw();
 try{
  await video.play();
 }catch(e){
  recorder.stop();
  return;
 }

 const checkEnd=()=>{
  if(!recording)return;
  if(video.currentTime>=to || video.ended){
   video.pause();
   recorder.stop();
  }else{
   setTimeout(checkEnd,100);
  }
 };
 checkEnd();
});
</script>
</body>
</html>
